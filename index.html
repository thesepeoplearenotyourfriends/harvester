<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>Harvester</title>
    <link rel="stylesheet" href="css/my.css" />
  </head>
  <body>
    <header id="menu-bar">
      <div class="menu">
        <button
          id="work-menu"
          class="menu-label"
          type="button"
          aria-expanded="false"
        >
          Work
        </button>
        <div class="menu-items">
          <button data-work="missing-actor-images">Missing Actor Images</button
          ><button data-work="failed-actors">Failed Actors</button
          ><button data-work="lost-found">Missing Movie NFO</button
          ><button data-work="missing-posters">Missing Movie Posters</button
          ><button data-work="unresolved-movies">Unresolved Movies</button
          ><button data-work="unresolved-tv">Unresolved TV</button>
          <button data-work="inbox">Bulk Inbox</button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-label" type="button" aria-expanded="false">
          View
        </button>
        <div class="menu-items">
          <button id="toggle-context">Hide Context Pane</button
          ><button id="reset-pane">Reset Pane Width</button
          ><button id="open-configuration">Configuration…</button>
        </div>
      </div>
      <label id="search-box"
        ><span>Search</span><input id="search" type="search" autocomplete="off"
      /></label>
    </header>
    <main id="app-shell">
      <div id="workbench">
        <aside id="context-pane" aria-live="polite"></aside>
        <div
          id="splitter"
          role="separator"
          aria-label="Resize context pane"
          aria-orientation="vertical"
          tabindex="0"
        ></div>
        <section id="workspace" aria-live="polite"></section>
      </div>
      <section id="bulk-drawer" hidden aria-label="Bulk work"></section>
      <button id="job-strip" type="button" aria-expanded="false">Bulk: idle</button>
    </main>
    <dialog id="configuration"><form><h1>Configuration</h1><p class="muted">Environment variables override stored values; overridden fields are marked below.</p><div id="configuration-fields"></div><p class="error" id="configuration-error" hidden></p><div class="dialog-actions"><button id="cancel-configuration" type="button">Cancel</button><button id="save-configuration" type="button">Save</button></div></form></dialog>
    <script>
      "use strict";
      const PACKAGE_ID = "com.harvester.app";
      const COLLECTION_CACHE_VERSION = 1;
      const SESSION_ID = [...crypto.getRandomValues(new Uint8Array(16))]
        .map((value) => value.toString(16).padStart(2, "0")).join("");
      const state = {
        workflow: "overview",
        inventory: {},
        rows: [],
        generation: 0,
        selectionGeneration: 0,
        leftWidth: 184,
        contextVisible: true,
        searchTimer: null,
        collectionDescriptor: null,
        bulk: { job: null, drawerOpen: false },
        inbox: { items: [], unseen: 0, ready: 0, attention: 0, applied: 0, candidateIndexes: {} },
        selectedIndex: null,
      };
      const workflows = {
        "missing-actor-images": {
          title: "Missing Actor Images",
          action: "list.actors",
          data: { missing: "image" },
          get: "get.actor",
          kind: "actor",
          repair: true,
        },
        "failed-actors": {
          title: "Failed Actors",
          action: "list.actors",
          data: { status: "failed" },
          get: "get.actor",
          kind: "actor",
        },
        "lost-found": {
          title: "Missing Movie NFO",
          action: "list.movies",
          data: { missing: "nfo" },
          get: "get.movie",
          inspect: "inspect.movie",
          kind: "movie",
        },
        "missing-posters": {
          title: "Missing Movie Posters",
          action: "list.movies",
          data: { missing: "poster" },
          get: "get.movie",
          inspect: "inspect.movie",
          kind: "movie",
        },
        "unresolved-movies": {
          title: "Unresolved Movies",
          action: "list.movies",
          data: { status: "unresolved" },
          get: "get.movie",
          inspect: "inspect.movie",
          kind: "movie",
        },
        "failed-movies": {
          title: "Failed Movies",
          action: "list.movies",
          data: { status: "failed" },
          get: "get.movie",
          inspect: "inspect.movie",
          kind: "movie",
        },
        "ambiguous-tv": {
          title: "Ambiguous TV",
          action: "list.shows",
          data: { status: "ambiguous" },
          get: "get.show",
          inspect: "inspect.show",
          kind: "show",
        },
        "unresolved-tv": {
          title: "Unresolved TV", action: "list.shows", data: { status: "unresolved" },
          get: "get.show", inspect: "inspect.show", kind: "show",
        },
        "not-found-tv": {
          title: "TV Not Found",
          action: "list.shows",
          data: { status: "not_found" },
          get: "get.show",
          inspect: "inspect.show",
          kind: "show",
        },
        "tv-errors": {
          title: "TV Errors",
          action: "list.shows",
          data: { status: "error" },
          get: "get.show",
          inspect: "inspect.show",
          kind: "show",
        },
        "missing-tv-nfo": {
          title: "Missing TV NFO", action: "list.shows", data: { missing: "nfo" },
          get: "get.show", inspect: "inspect.show", kind: "show",
        },
        "missing-tv-posters": {
          title: "Missing TV Posters", action: "list.shows", data: { missing: "poster" },
          get: "get.show", inspect: "inspect.show", kind: "show",
        },
        "all-actors": {
          title: "All Actors",
          action: "list.actors",
          data: {},
          get: "get.actor",
          kind: "actor",
        },
        "all-movies": {
          title: "All Movies",
          action: "list.movies",
          data: {},
          get: "get.movie",
          inspect: "inspect.movie",
          kind: "movie",
        },
        "all-tv": {
          title: "All TV",
          action: "list.shows",
          data: {},
          get: "get.show",
          inspect: "inspect.show",
          kind: "show",
        },
        providers: { title: "Providers", action: "providers", data: {} },
      };
      const bulkWorkflows = {
        "missing-actor-images": { kind: "actor", aspect: "image" },
        "failed-actors": { kind: "actor", aspect: "identity" },
        "lost-found": { kind: "movie", aspect: "nfo" },
        "missing-posters": { kind: "movie", aspect: "poster" },
        "unresolved-movies": { kind: "movie", aspect: "identity" },
        "failed-movies": { kind: "movie", aspect: "identity" },
        "ambiguous-tv": { kind: "show", aspect: "identity" },
        "unresolved-tv": { kind: "show", aspect: "identity" },
        "not-found-tv": { kind: "show", aspect: "identity" },
        "tv-errors": { kind: "show", aspect: "identity" },
        "missing-tv-nfo": { kind: "show", aspect: "nfo" },
        "missing-tv-posters": { kind: "show", aspect: "poster" },
      };
      const App = {
        id: 1,
        async request(action, data = {}, selection = false, background = false, onEvent = null) {
          const generation = state.generation,
            token = state.selectionGeneration;
          if (!globalThis.severin?.send)
            throw Error("Severin bridge is not available");
          const requestId = this.id++;
          if (["bulk.workflow", "bulk.item", "item.refetch", "inbox.retry", "inbox.select_candidate"].includes(action)) state.bulk.job.requestId = requestId;
          const pending = globalThis.severin.send({
            id: requestId,
            session: SESSION_ID,
            action,
            data,
          });
          let polling = true;
          const poll = async () => {
            let delivered = 0;
            const readEvents = async () => {
              const response = await fetch(`asset://${PACKAGE_ID}/.cache/ui/events-${SESSION_ID}-${requestId}.json`, { cache: "no-store" });
              if (response.ok) {
                const channel = await response.json();
                while (delivered < (channel.events || []).length) onEvent(channel.events[delivered++]);
              }
            };
            while (polling) {
              try {
                await readEvents();
              } catch (_) { /* The host may not have published the channel yet. */ }
              if (polling) await new Promise((resolve) => setTimeout(resolve, 80));
            }
            try { await readEvents(); } catch (_) { /* Terminal reply remains authoritative. */ }
          };
          const pollingTask = onEvent ? poll() : null;
          let reply;
          try { reply = await pending; } finally { polling = false; }
          if (pollingTask) await pollingTask;
          if (
            !background &&
            (generation !== state.generation ||
              (selection && token !== state.selectionGeneration))
          )
            throw new DOMException("Stale response", "AbortError");
          if (typeof reply === "string") reply = JSON.parse(reply);
          if (!reply?.ok) throw Error(reply?.error || "Bridge request failed");
          return reply.result;
        },
        async requestCollection(action, data = {}) {
          const generation = state.generation;
          const descriptor = await this.request(action, data);
          if (
            typeof descriptor?.asset !== "string" ||
            !descriptor.asset.startsWith(
              `asset://${PACKAGE_ID}/.cache/ui/collection-v${COLLECTION_CACHE_VERSION}-`,
            ) ||
            descriptor.version !== COLLECTION_CACHE_VERSION
          ) {
            throw Error("Bridge returned an invalid collection descriptor");
          }
          const response = await fetch(descriptor.asset, { cache: "no-store" });
          if (!response.ok) throw Error("Could not read collection cache");
          const collection = await response.json();
          if (generation !== state.generation) {
            throw new DOMException("Stale response", "AbortError");
          }
          if (
            collection?.version !== COLLECTION_CACHE_VERSION ||
            collection.generation !== descriptor.generation ||
            !Array.isArray(collection.items) ||
            collection.items.length !== descriptor.count
          ) {
            throw Error("Collection cache did not match its descriptor");
          }
          return { items: collection.items, descriptor };
        },
      };
      const esc = (value) =>
        String(value ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      function count(section, key) {
        return state.inventory?.[section]?.[key] ?? 0;
      }
      function tocRows() {
        return [
          { h: "Actors" },
          { n: "All", w: "all-actors", c: count("actors", "total") },
          {
            n: "Missing image",
            w: "missing-actor-images",
            c: count("actors", "total") - count("actors", "local"),
          },
          { n: "Failed", w: "failed-actors", c: count("actors", "failed") },
          { h: "Movies" },
          { n: "All", w: "all-movies", c: count("movies", "total") },
          {
            n: "Missing NFO",
            w: "lost-found",
            c: count("movies", "missing_nfo"),
          },
          {
            n: "Missing poster",
            w: "missing-posters",
            c: count("movies", "missing_poster"),
          },
          {
            n: "Unresolved",
            w: "unresolved-movies",
            c: count("movies", "unresolved"),
          },
          { n: "Failed", w: "failed-movies", c: count("movies", "failed") },
          { h: "TV" },
          {
            n: "All",
            w: "all-tv",
            c: count("tv", "total"),
          },
          { n: "Missing NFO", w: "missing-tv-nfo", c: count("tv", "missing_nfo") },
          { n: "Missing poster", w: "missing-tv-posters", c: count("tv", "missing_poster") },
          { n: "Unresolved", w: "unresolved-tv", c: count("tv", "ambiguous") + count("tv", "not_found") },
          { n: "Failed", w: "tv-errors", c: count("tv", "error") },
          { h: "Providers" },
          { n: "Provider status", w: "providers" },
          { h: "Review" },
          { n: "Bulk Inbox", w: "inbox", c: state.inbox.items.length },
        ];
      }
      function renderOverview() {
        state.selectionGeneration++;
        state.workflow = "overview";
        document.querySelector("#context-pane").innerHTML =
          '<div class="context-scroll"><h1>Overview</h1><div class="toc">' +
          tocRows()
            .map((r) =>
              r.h
                ? `<h2>${r.h}</h2>`
                : `<button data-work="${r.w}"><span>${r.n}</span>${r.c === undefined ? "" : `<b>${r.c}</b>`}</button>`,
            )
            .join("") +
          "</div></div>";
        let groups = {
          Actors: tocRows().slice(1, 4),
          Movies: tocRows().slice(5, 10),
          TV: tocRows().slice(11, 16),
        };
        document.querySelector("#workspace").innerHTML =
          '<div class="overview"><h1>Overview</h1><p class="muted">Saved work and local receipts</p>' +
          Object.entries(groups)
            .map(
              ([name, rows]) =>
                `<section><h2>${name}</h2>${rows.map((r) => `<button class="summary-row" data-work="${r.w}"><span>${r.n}</span><b>${r.c}</b></button>`).join("")}</section>`,
            )
            .join("") +
          "</div>";
        bindWork();
      }
      function rowLabel(row) {
        return (
          row.display_name ||
          row.label ||
          row.name ||
          row.local_target ||
          row.key ||
          "Item"
        );
      }
      function rowIdentifier(row) {
        return row.identifier || row.name || row.local_target;
      }
      function renderContext(title, rows) {
        const scan = bulkWorkflows[state.workflow]
          ? '<button id="scan-all" class="compact-action" type="button">Re-fetch from web</button>'
          : "";
        document.querySelector("#context-pane").innerHTML =
          `<div class="context-nav"><button id="back-overview">⮪ Overview</button></div><div class="context-scroll"><div class="workflow-heading"><h1>${esc(title)}</h1>${scan}</div><div class="queue">${rows.map((r, i) => `<button data-row="${i}"><span>${r.kind ? `<small>${esc(r.kind.toUpperCase())}</small>` : ""}${esc(rowLabel(r))}</span></button>`).join("")}</div></div>`;
        document.querySelector("#back-overview").onclick = () => loadOverview();
        const scanAll = document.querySelector("#scan-all");
        if (scanAll) scanAll.onclick = startBulkWorkflow;
        setWriterControls();
        document
          .querySelectorAll("[data-row]")
          .forEach((b) => (b.onclick = () => selectRow(+b.dataset.row)));
      }
      async function openWorkflow(name) {
        if (name === "inbox") {
          await openInbox();
          return;
        }
        const cfg = workflows[name];
        if (!cfg) return;
        state.generation++;
        state.selectionGeneration++;
        state.workflow = name;
        state.rows = [];
        state.collectionDescriptor = null;
        renderContext(cfg.title, []);
        document.querySelector("#workspace").innerHTML =
          `<p class="muted">Loading ${esc(cfg.title)}…</p>`;
        try {
          if (name === "providers") {
            const value = await App.request(cfg.action, cfg.data);
            state.rows = Array.isArray(value.providers) ? value.providers : [];
          } else {
            const collection = await App.requestCollection(cfg.action, cfg.data);
            state.rows = collection.items;
            state.collectionDescriptor = collection.descriptor;
          }
          renderContext(cfg.title, state.rows);
          document.querySelector("#workspace").innerHTML = state.rows.length
            ? '<p class="muted">Select an item from the context pane.</p>'
            : '<p class="muted">No items in this queue.</p>';
        } catch (e) {
          if (e.name !== "AbortError")
            document.querySelector("#workspace").textContent = e.message;
        }
      }
      async function startBulkWorkflow() {
        if (state.bulk.job?.status === "running") return;
        const workflow = state.workflow;
        const cfg = workflows[workflow];
        const scope = state.collectionDescriptor && { ...state.collectionDescriptor };
        if (!scope) return;
        await runBulk("bulk.workflow", { workflow, scope }, cfg.title, scope, state.rows);
      }
      async function runBulk(action, data, title, scope, rows, selectedIndex = null) {
        const workflow = data.workflow;
        const identityOwners = new Map();
        rows.forEach((row, index) => {
          const ids = row.grouped && Array.isArray(row.manifest_identities) ? row.manifest_identities : [rowIdentifier(row)];
          ids.filter(Boolean).forEach((id) => identityOwners.set(String(id), index));
        });
        state.bulk.job = {
          workflow,
          title,
          scope,
          total: rows.length,
          processed: null,
          liveProcessed: 0,
          seenOwners: new Set(),
          identityOwners,
          activity: "",
          activityStatus: "",
          stage: "",
          counts: {},
          status: rows.length ? "running" : "complete",
          message: rows.length ? "Working…" : "Nothing to process",
        };
        setWriterControls();
        renderBulkPresentations();
        if (!rows.length) return;
        try {
          const result = await App.request(action, data, false, true, updateBulkEvent);
          Object.assign(state.bulk.job, {
            status: result?.ok === false ? "attention" : result?.preparation ? "prepared" : "complete",
            processed: Number.isInteger(result?.processed) ? result.processed : null,
            counts: result?.counts || {},
            message: result?.message || "Finished",
          });
        } catch (error) {
          Object.assign(state.bulk.job, { status: error.message.includes("Acquisition stopped") ? "interrupted" : "failed", message: error.message });
        }
        setWriterControls();
        renderBulkPresentations();
      }
      function updateBulkEvent(event) {
        const job = state.bulk.job;
        if (!job || job.status !== "running") return;
        advanceBulkProgress(job, event);
        renderBulkPresentations();
        if (event.event === "inbox") refreshInboxSummary();
      }
      function advanceBulkProgress(job, event) {
        job.activity = event.label || event.id || event.message || "Working…";
        job.activityStatus = event.status || "";
        job.stage = event.event === "prepared" ? "preparing" : event.event === "progress" ? "resolving" : event.event;
        let owner = job.identityOwners.get(String(event.id));
        if (owner === undefined && event.event === "inbox" && Number.isInteger(event.row_index)) owner = event.row_index;
        if (owner !== undefined && !job.seenOwners.has(owner)) {
          job.seenOwners.add(owner);
          job.liveProcessed = job.seenOwners.size;
        }
      }
      function writerActive() {
        return state.bulk.job?.status === "running";
      }
      function setWriterControls() {
        const active = writerActive();
        document.querySelectorAll("#scan-all, #refetch-item, #choose-image, #image-file, #choose-search-image, #search-image-file").forEach((control) => {
          control.disabled = active;
        });
        document.body.classList.toggle("bulk-writing", active);
      }
      function bulkMarkup() {
        const job = state.bulk.job;
        const title = '<div class="bulk-title"><h1>Bulk Inbox</h1><button id="close-bulk" type="button" aria-label="Close Bulk drawer">×</button></div>';
        if (!job) return `${title}<div class="bulk-content bulk-empty"><p>${state.inbox.unseen} unseen · ${state.inbox.ready} ready · ${state.inbox.attention} needs attention</p><button id="open-inbox" type="button">Open Inbox</button></div>`;
        const progress = job.status === "running" ? `${job.liveProcessed} / ${job.total}`
          : job.processed !== null ? `${job.processed} processed`
          : ["failed", "interrupted"].includes(job.status) ? "" : "Finished";
        const counts = Object.entries(job.counts || {}).map(([name, value]) => `<li>${esc(name.replaceAll("_", " "))}: ${esc(value)}</li>`).join("");
        const activity = job.status === "running" && job.activity ? `<p><strong>${esc(job.stage ? job.stage[0].toUpperCase() + job.stage.slice(1) + ":" : "Current:")}</strong><br>${esc(job.activity)}${job.activityStatus ? ` · ${esc(job.activityStatus)}` : ""}</p>` : "";
        const inbox = state.inbox;
        return `${title}<div class="bulk-content"><h2>${esc(job.title)}</h2><p><strong>${esc(job.status)}</strong>${progress ? ` · ${esc(progress)}` : ""}</p>${job.status === "running" ? '<progress aria-label="Bulk work in progress"></progress><button id="stop-bulk">Stop acquisition</button>' : ""}${activity}<dl><dt>Unseen</dt><dd>${inbox.unseen}</dd><dt>Ready</dt><dd>${inbox.ready}</dd><dt>Needs attention</dt><dd>${inbox.attention}</dd><dt>Applied</dt><dd>${inbox.applied}</dd></dl><button id="open-inbox" type="button">Open Inbox</button><p class="muted">${esc(job.message)}</p>${counts ? `<ul>${counts}</ul>` : ""}</div>`;
      }
      function renderBulkPresentations() {
        const job = state.bulk.job;
        const strip = document.querySelector("#job-strip");
        strip.textContent = !job ? `Bulk Inbox: ${state.inbox.items.length} pending` : `Bulk: ${job.title} · ${job.status}${job.processed === null ? "" : ` · ${job.processed} processed`}`;
        strip.setAttribute("aria-expanded", state.bulk.drawerOpen);
        const drawer = document.querySelector("#bulk-drawer");
        drawer.hidden = !state.bulk.drawerOpen;
        drawer.innerHTML = state.bulk.drawerOpen ? bulkMarkup() : "";
        const close = document.querySelector("#close-bulk");
        if (close) close.onclick = (event) => { event.stopPropagation(); state.bulk.drawerOpen = false; renderBulkPresentations(); };
        const open = document.querySelector("#open-inbox");
        if (open) open.onclick = () => openInbox();
        const stop = document.querySelector("#stop-bulk");
        if (stop) stop.onclick = () => App.request("bulk.stop", { request_id: job.requestId }, false, true);
      }
      async function refreshInboxSummary() {
        const value = await App.request("inbox.list", {}, false, true);
        state.inbox.items = value.items || [];
        state.inbox.unseen = state.inbox.items.filter((item) => !item.seen).length;
        state.inbox.ready = state.inbox.items.filter((item) => item.state === "ready").length;
        state.inbox.attention = state.inbox.items.filter((item) => item.state === "needs_attention").length;
        renderBulkPresentations();
      }
      async function openInbox() {
        state.generation++;
        state.selectionGeneration++;
        state.workflow = "inbox";
        const generation = state.generation, selectionGeneration = state.selectionGeneration;
        await refreshInboxSummary();
        if (state.workflow !== "inbox" || generation !== state.generation || selectionGeneration !== state.selectionGeneration) return false;
        const items = state.inbox.items;
        const outcomeMarker = (item) => ({ ready: "🟢", partial: "🟡", failure: "⚠" })[item.summary?.outcome || (item.state === "ready" ? "ready" : "failure")];
        document.querySelector("#context-pane").innerHTML = `<div class="context-nav"><button id="back-overview">⮪ Overview</button></div><div class="context-scroll"><div class="workflow-heading"><h1>Bulk Inbox</h1></div><div class="queue">${items.map((item, index) => `<button data-inbox-row="${index}" class="${item.seen ? "" : "unseen"}"><span>${outcomeMarker(item)} ${esc(item.display_title)}</span></button>`).join("")}</div><div class="inbox-actions"><button id="apply-ready">Apply All Ready</button><button id="discard-all">Discard All Pending</button></div></div>`;
        document.querySelector("#workspace").innerHTML = items.length ? '<p class="muted">Select prepared work to review.</p>' : '<p class="muted">The Bulk Inbox is empty.</p>';
        document.querySelector("#back-overview").onclick = loadOverview;
        document.querySelectorAll("[data-inbox-row]").forEach((button) => button.onclick = () => selectInboxItem(+button.dataset.inboxRow));
        document.querySelector("#apply-ready").onclick = () => inboxBatch("inbox.apply_all");
        document.querySelector("#discard-all").onclick = () => inboxBatch("inbox.discard_all");
        return true;
      }
      async function selectInboxItem(index) {
        state.selectionGeneration++;
        const summary = state.inbox.items[index];
        const item = await App.request("inbox.get", { item_id: summary.item_id }, true);
        summary.seen = true;
        const writes = item.actions.filter((action) => action.action === "write");
        const preview = writes.find((action) => /\.(jpe?g|png|webp)$/i.test(action.path));
        const previewUrl = preview ? `asset://${PACKAGE_ID}/.cache/bulk/inbox/${item.item_id}/${preview.blob}` : null;
        const kind = item.kind;
        if (!["actor", "movie", "show"].includes(kind)) throw Error("Inbox item has no authoritative media kind");
        const query = { ...(item.query?.inferred || {}), ...(item.query?.override || {}) };
        const queryFields = kind === "actor"

        document
          .querySelectorAll("[data-row]")
          .forEach((b, i) => b.classList.toggle("selected", i === index));
        document.querySelector("#workspace").innerHTML =
          '<p class="muted">Loading…</p>';
        if (state.workflow === "providers") {
          renderProvider(row);
          return;
        }
        if (!cfg?.get) return;
        try {
          let detail = await App.request(
            cfg.inspect || cfg.get,
            { identifier: rowIdentifier(row) },
            true,
          );
          if (!cfg.inspect) {
            cfg.repair ? renderActorRepair(detail) : renderRecordInspector(detail);
            return;
          }
          const rawIds = row.grouped
            ? detail.manifest_identities
            : [row.identifier || detail.selected_manifest_identity];
          renderInspector(detail, await rawRecords(detail.kind, rawIds));
        } catch (e) {
          if (e.name !== "AbortError") showError(e.message);
        }
      }
      async function startSelectedBulk() {
        if (writerActive() || state.selectedIndex === null || !state.collectionDescriptor) return;
        const index = state.selectedIndex, workflow = state.workflow, row = state.rows[index];
        const scope = { ...state.collectionDescriptor };
        await runBulk("bulk.item", { workflow, scope, index }, `${workflows[workflow].title}: ${rowLabel(row)}`, scope, [row], index);
      }
      async function search(query) {
        state.generation++;
        state.selectionGeneration++;
        state.workflow = "search";
        try {
          const collection = await App.requestCollection("search", { query });
          state.rows = collection.items;
          renderContext("Search results", state.rows);
          document.querySelector("#workspace").innerHTML = state.rows.length
            ? '<p class="muted">Select a search result.</p>'
            : '<p class="muted">No local matches.</p>';
          document
            .querySelectorAll("[data-row]")
            .forEach((b) => (b.onclick = () => selectSearch(+b.dataset.row)));
        } catch (e) {
          if (e.name !== "AbortError") showError(e.message);
        }
      }
      async function selectSearch(i) {
        let row = state.rows[i];
        state.selectionGeneration++;
        try {
          const inspectable = row.kind === "movie" || row.kind === "show";
          let detail = await App.request(
            `${inspectable ? "inspect" : "get"}.${row.kind}`,
            { identifier: row.identifier },
            true,
          );
          if (!inspectable) {
            renderRecordInspector(detail);
            return;
          }
          renderInspector(detail, await rawRecords(row.kind, [row.identifier]));
        } catch (e) {
          if (e.name !== "AbortError") showError(e.message);
        }
      }
      async function refreshInventory() {
        try {
          state.inventory = await App.request("inventory");
        } catch (e) {
          if (e.name !== "AbortError") showError(e.message);
        }
      }
      async function loadOverview() {
        const generation = ++state.generation;
        renderOverview();
        try {
          const inventory = await App.request("inventory", {}, false, true);
          if (generation !== state.generation || state.workflow !== "overview") return;
          state.inventory = inventory;
          renderOverview();
        } catch (e) {
          if (e.name !== "AbortError" && generation === state.generation && state.workflow === "overview")
            showError(e.message);
        }
      }
      async function start() {
        const generation = ++state.generation;
        setStartupScanning(true);
        try {
          await App.request("rescan");
        } catch (error) {
          if (error.name !== "AbortError") {
            console.warn("Local census rescan skipped:", error.message);
            showStartupRescanFailure(error);
            document.querySelector("#work-menu").disabled = false;
            document.querySelector('[data-work="inbox"]').disabled = false;
            await refreshInboxSummary();
          }
          return;
        }
        setStartupScanning(false);
        if (generation !== state.generation) return;
        await loadOverview();
        await refreshInboxSummary();
      }
      function showStartupRescanFailure(error) {
        document.querySelector("#context-pane").innerHTML =
          "<h1>Local library unavailable</h1>";
        document.querySelector("#workspace").innerHTML = `
          <article class="inspector">
            <h1>Census not refreshed</h1>
            <p>Harvester could not verify the local Movie and TV libraries.</p>
            <p class="error">${esc(error.message || "Local rescan failed")}</p>
            <p class="muted">Work queues and Search remain unavailable until Harvester can complete a local rescan.</p>
          </article>`;
      }
      function setStartupScanning(scanning) {
        document.querySelector("#work-menu").disabled = scanning;
        document.querySelectorAll("[data-work]").forEach((button) => {
          button.disabled = scanning;
        });
        document.querySelector("#search").disabled = scanning;
        if (scanning) {
          closeMenus();
          document.querySelector("#context-pane").innerHTML =
            "<h1>Scanning local libraries…</h1>";
          document.querySelector("#workspace").innerHTML =
            '<p class="muted">Rebuilding the local census before loading queues.</p>';
        }
      }
      function bindWork() {
        document.querySelectorAll("[data-work]").forEach(
          (b) =>
            (b.onclick = () => {
              closeMenus();
              openWorkflow(b.dataset.work);
            }),
        );
      }
      bindWork();
      document.querySelector("#job-strip").onclick = () => {
        state.bulk.drawerOpen = !state.bulk.drawerOpen;
        renderBulkPresentations();
      };
      document.querySelector("#search").oninput = (e) => {
        clearTimeout(state.searchTimer);
        let q = e.target.value.trim();
        state.searchTimer = setTimeout(
          () => (q ? search(q) : loadOverview()),
          220,
        );
      };
      function closeMenus() {
        document.querySelectorAll(".menu.open").forEach((m) => {
          m.classList.remove("open");
          m.querySelector(".menu-label").setAttribute("aria-expanded", "false");
        });
      }
      document.querySelectorAll(".menu-label").forEach(
        (b) =>
          (b.onclick = () => {
            let m = b.parentElement,
              o = !m.classList.contains("open");
            closeMenus();
            m.classList.toggle("open", o);
            b.setAttribute("aria-expanded", o);
          }),
      );
      document.onclick = (e) => {
        if (!e.target.closest(".menu")) closeMenus();
      };
      document.onkeydown = (e) => {
        if (e.key === "Escape") closeMenus();
      };
      const splitter = document.querySelector("#splitter"),
        pane = document.querySelector("#context-pane");
      function setWidth(w) {
        state.leftWidth = Math.max(130, Math.min(w, innerWidth - 260));
        pane.style.width = state.leftWidth + "px";
      }
      splitter.onpointerdown = (e) => {
        splitter.setPointerCapture(e.pointerId);
        let start = e.clientX,
          width = state.leftWidth;
        splitter.onpointermove = (m) => setWidth(width + m.clientX - start);
        splitter.onpointerup = () => (splitter.onpointermove = null);
      };
      splitter.ondblclick = () => setWidth(184);
      splitter.onkeydown = (e) => {
        if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
          e.preventDefault();
          setWidth(state.leftWidth + (e.key === "ArrowRight" ? 10 : -10));
        }
      };
      document.querySelector("#reset-pane").onclick = () => {
        setWidth(184);
        closeMenus();
      };
      const configFields = [
        ["tmdb_api_key", "API key", "tmdb"], ["tmdb_bearer_token", "Bearer token", "tmdb"],
        ["tvdb_api_key", "API key", "tvdb"], ["tvdb_pin", "PIN", "tvdb"],
        ["socks5", "Proxy", "socks"], ["socks5_username", "Username", "socks"],
        ["socks5_password", "Password", "socks"],
      ];
      function configurationMarkup(config) {
        return ["tmdb", "tvdb", "socks"].map((group) => `<section class="config-provider"><h2>${group === "socks" ? "SOCKS" : group.toUpperCase()}</h2><div class="config-row">${configFields.filter((field) => field[2] === group).map(([name, label]) => `<label><span>${esc(label)}${config.environment_overrides[name] ? ' <small>overridden by environment</small>' : ""}</span><input name="${name}" type="${name === "socks5_password" ? "password" : "text"}" value="${esc(config.values[name])}" autocomplete="off"></label>`).join("")}</div></section>`).join("");
      }
      document.querySelector("#open-configuration").onclick = async () => {
        closeMenus();
        const dialog = document.querySelector("#configuration"), fields = document.querySelector("#configuration-fields");
        document.querySelector("#configuration-error").textContent = "";
        document.querySelector("#configuration-error").hidden = true;
        fields.innerHTML = '<p class="muted">Loading…</p>';
        dialog.showModal();
        try {
          const config = await App.request("config.get");
          fields.innerHTML = configurationMarkup(config);
        } catch (error) { const node = document.querySelector("#configuration-error"); node.textContent = error.message; node.hidden = false; }
      };
      document.querySelector("#save-configuration").onclick = async (event) => {
        event.preventDefault();
        const inputs = [...document.querySelectorAll("#configuration-fields input")];
        if (inputs.length !== configFields.length) return;
        const values = Object.fromEntries(inputs.map((input) => [input.name, input.value]));
        try {
          const config = await App.request("config.save", { values });
          document.querySelector("#configuration-fields").innerHTML = configurationMarkup(config);
          document.querySelector("#configuration").close();
        } catch (error) { const node = document.querySelector("#configuration-error"); node.textContent = error.message; node.hidden = false; }
      };
      document.querySelector("#cancel-configuration").onclick = () => {
        document.querySelector("#configuration").close();
      };
      document.querySelector("#toggle-context").onclick = (e) => {
        state.contextVisible = !state.contextVisible;
        pane.hidden = !state.contextVisible;
        splitter.hidden = !state.contextVisible;
        e.target.textContent = state.contextVisible
          ? "Hide Context Pane"
          : "Show Context Pane";
        closeMenus();
      };
      setWidth(184);
      start();
    </script>
  </body>
</html>
