<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>Harvester</title>
    <link rel="stylesheet" href="css/my.css" />
  </head>
  <body>
    <header id="menu-bar">
      <div class="menu">
        <button
          id="work-menu"
          class="menu-label"
          type="button"
          aria-expanded="false"
        >
          Work
        </button>
        <div class="menu-items">
          <button data-work="missing-actor-images">Missing Actor Images</button
          ><button data-work="failed-actors">Failed Actors</button
          ><button data-work="lost-found">Lost &amp; Found</button
          ><button data-work="missing-posters">Missing Movie Posters</button
          ><button data-work="unresolved-movies">Unresolved Movies</button
          ><button data-work="ambiguous-tv">Ambiguous TV</button
          ><button data-work="not-found-tv">TV Not Found</button>
          <button data-work="bulk">Bulk</button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-label" type="button" aria-expanded="false">
          View
        </button>
        <div class="menu-items">
          <button id="toggle-context">Hide Context Pane</button
          ><button id="reset-pane">Reset Pane Width</button>
        </div>
      </div>
      <label id="search-box"
        ><span>Search</span><input id="search" type="search" autocomplete="off"
      /></label>
    </header>
    <main id="app-shell">
      <div id="workbench">
        <aside id="context-pane" aria-live="polite"></aside>
        <div
          id="splitter"
          role="separator"
          aria-label="Resize context pane"
          aria-orientation="vertical"
          tabindex="0"
        ></div>
        <section id="workspace" aria-live="polite"></section>
      </div>
      <section id="bulk-drawer" hidden aria-label="Bulk work"></section>
      <button id="job-strip" type="button" aria-expanded="false">Bulk: idle</button>
    </main>
    <script>
      "use strict";
      const PACKAGE_ID = "com.harvester.app";
      const COLLECTION_CACHE_VERSION = 1;
      const state = {
        workflow: "overview",
        inventory: {},
        rows: [],
        generation: 0,
        selectionGeneration: 0,
        leftWidth: 184,
        contextVisible: true,
        searchTimer: null,
        collectionDescriptor: null,
        bulk: { job: null, drawerOpen: false },
      };
      const workflows = {
        "missing-actor-images": {
          title: "Missing Actor Images",
          action: "list.actors",
          data: { missing: "image" },
          get: "get.actor",
          kind: "actor",
          repair: true,
        },
        "failed-actors": {
          title: "Failed Actors",
          action: "list.actors",
          data: { status: "failed" },
          get: "get.actor",
          kind: "actor",
        },
        "lost-found": {
          title: "Lost & Found",
          action: "list.movies",
          data: { missing: "nfo" },
          get: "get.movie",
          inspect: "inspect.movie",
          kind: "movie",
        },
        "missing-posters": {
          title: "Missing Movie Posters",
          action: "list.movies",
          data: { missing: "poster" },
          get: "get.movie",
          inspect: "inspect.movie",
          kind: "movie",
        },
        "unresolved-movies": {
          title: "Unresolved Movies",
          action: "list.movies",
          data: { status: "unresolved" },
          get: "get.movie",
          inspect: "inspect.movie",
          kind: "movie",
        },
        "failed-movies": {
          title: "Failed Movies",
          action: "list.movies",
          data: { status: "failed" },
          get: "get.movie",
          inspect: "inspect.movie",
          kind: "movie",
        },
        "ambiguous-tv": {
          title: "Ambiguous TV",
          action: "list.shows",
          data: { status: "ambiguous" },
          get: "get.show",
          inspect: "inspect.show",
          kind: "show",
        },
        "not-found-tv": {
          title: "TV Not Found",
          action: "list.shows",
          data: { status: "not_found" },
          get: "get.show",
          inspect: "inspect.show",
          kind: "show",
        },
        "tv-errors": {
          title: "TV Errors",
          action: "list.shows",
          data: { status: "error" },
          get: "get.show",
          inspect: "inspect.show",
          kind: "show",
        },
        "all-actors": {
          title: "All Actors",
          action: "list.actors",
          data: {},
          get: "get.actor",
          kind: "actor",
        },
        "all-movies": {
          title: "All Movies",
          action: "list.movies",
          data: {},
          get: "get.movie",
          inspect: "inspect.movie",
          kind: "movie",
        },
        "all-tv": {
          title: "All TV",
          action: "list.shows",
          data: {},
          get: "get.show",
          inspect: "inspect.show",
          kind: "show",
        },
        providers: { title: "Providers", action: "providers", data: {} },
      };
      const bulkWorkflows = {
        "missing-actor-images": { kind: "actor", aspect: "image" },
        "failed-actors": { kind: "actor", aspect: "identity" },
        "lost-found": { kind: "movie", aspect: "nfo" },
        "missing-posters": { kind: "movie", aspect: "poster" },
        "unresolved-movies": { kind: "movie", aspect: "identity" },
        "failed-movies": { kind: "movie", aspect: "identity" },
        "ambiguous-tv": { kind: "show", aspect: "identity" },
        "not-found-tv": { kind: "show", aspect: "identity" },
        "tv-errors": { kind: "show", aspect: "identity" },
      };
      const App = {
        id: 1,
        async request(action, data = {}, selection = false, background = false) {
          const generation = state.generation,
            token = state.selectionGeneration;
          if (!globalThis.severin?.send)
            throw Error("Severin bridge is not available");
          let reply = await globalThis.severin.send({
            id: this.id++,
            action,
            data,
          });
          if (
            !background &&
            (generation !== state.generation ||
              (selection && token !== state.selectionGeneration))
          )
            throw new DOMException("Stale response", "AbortError");
          if (typeof reply === "string") reply = JSON.parse(reply);
          if (!reply?.ok) throw Error(reply?.error || "Bridge request failed");
          return reply.result;
        },
        async requestCollection(action, data = {}) {
          const generation = state.generation;
          const descriptor = await this.request(action, data);
          if (
            typeof descriptor?.asset !== "string" ||
            !descriptor.asset.startsWith(
              `asset://${PACKAGE_ID}/.cache/ui/collection-v${COLLECTION_CACHE_VERSION}-`,
            ) ||
            descriptor.version !== COLLECTION_CACHE_VERSION
          ) {
            throw Error("Bridge returned an invalid collection descriptor");
          }
          const response = await fetch(descriptor.asset, { cache: "no-store" });
          if (!response.ok) throw Error("Could not read collection cache");
          const collection = await response.json();
          if (generation !== state.generation) {
            throw new DOMException("Stale response", "AbortError");
          }
          if (
            collection?.version !== COLLECTION_CACHE_VERSION ||
            collection.generation !== descriptor.generation ||
            !Array.isArray(collection.items) ||
            collection.items.length !== descriptor.count
          ) {
            throw Error("Collection cache did not match its descriptor");
          }
          return { items: collection.items, descriptor };
        },
      };
      const esc = (value) =>
        String(value ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      function count(section, key) {
        return state.inventory?.[section]?.[key] ?? 0;
      }
      function tocRows() {
        return [
          { h: "Actors" },
          { n: "All", w: "all-actors", c: count("actors", "total") },
          {
            n: "Missing image",
            w: "missing-actor-images",
            c: count("actors", "total") - count("actors", "local"),
          },
          { n: "Failed", w: "failed-actors", c: count("actors", "failed") },
          { h: "Movies" },
          { n: "All", w: "all-movies", c: count("movies", "total") },
          {
            n: "Lost & Found",
            w: "lost-found",
            c: count("movies", "missing_nfo"),
          },
          {
            n: "Missing poster",
            w: "missing-posters",
            c: count("movies", "missing_poster"),
          },
          {
            n: "Unresolved",
            w: "unresolved-movies",
            c: count("movies", "unresolved"),
          },
          { n: "Failed", w: "failed-movies", c: count("movies", "failed") },
          { h: "TV" },
          {
            n: "All",
            w: "all-tv",
            c: Object.values(state.inventory.tv || {}).reduce(
              (a, b) => a + b,
              0,
            ),
          },
          { n: "Ambiguous", w: "ambiguous-tv", c: count("tv", "ambiguous") },
          { n: "Not found", w: "not-found-tv", c: count("tv", "not_found") },
          { n: "Errors", w: "tv-errors", c: count("tv", "error") },
          { h: "Providers" },
          { n: "Provider status", w: "providers" },
        ];
      }
      function renderOverview() {
        state.selectionGeneration++;
        state.workflow = "overview";
        document.querySelector("#context-pane").innerHTML =
          '<h1>Overview</h1><div class="toc">' +
          tocRows()
            .map((r) =>
              r.h
                ? `<h2>${r.h}</h2>`
                : `<button data-work="${r.w}"><span>${r.n}</span>${r.c === undefined ? "" : `<b>${r.c}</b>`}</button>`,
            )
            .join("") +
          "</div>";
        let groups = {
          Actors: tocRows().slice(1, 4),
          Movies: tocRows().slice(5, 10),
          TV: tocRows().slice(11, 15),
        };
        document.querySelector("#workspace").innerHTML =
          '<div class="overview"><h1>Overview</h1><p class="muted">Saved work and local receipts</p>' +
          Object.entries(groups)
            .map(
              ([name, rows]) =>
                `<section><h2>${name}</h2>${rows.map((r) => `<button class="summary-row" data-work="${r.w}"><span>${r.n}</span><b>${r.c}</b></button>`).join("")}</section>`,
            )
            .join("") +
          "</div>";
        bindWork();
      }
      function rowLabel(row) {
        return (
          row.display_name ||
          row.label ||
          row.name ||
          row.local_target ||
          row.key ||
          "Item"
        );
      }
      function rowIdentifier(row) {
        return row.identifier || row.name || row.local_target;
      }
      function renderContext(title, rows) {
        const scan = bulkWorkflows[state.workflow]
          ? '<button id="scan-all" class="compact-action" type="button">Re-fetch from web</button>'
          : "";
        document.querySelector("#context-pane").innerHTML =
          `<div class="context-nav"><button id="back-overview">⮪ Overview</button></div><div class="workflow-heading"><h1>${esc(title)}</h1>${scan}</div><div class="queue">${rows.map((r, i) => `<button data-row="${i}"><span>${r.kind ? `<small>${esc(r.kind.toUpperCase())}</small>` : ""}${esc(rowLabel(r))}</span></button>`).join("")}</div>`;
        document.querySelector("#back-overview").onclick = () => loadOverview();
        const scanAll = document.querySelector("#scan-all");
        if (scanAll) scanAll.onclick = startBulkWorkflow;
        setWriterControls();
        document
          .querySelectorAll("[data-row]")
          .forEach((b) => (b.onclick = () => selectRow(+b.dataset.row)));
      }
      async function openWorkflow(name) {
        if (name === "bulk") {
          showBulkWorkspace();
          return;
        }
        const cfg = workflows[name];
        if (!cfg) return;
        state.generation++;
        state.selectionGeneration++;
        state.workflow = name;
        state.rows = [];
        state.collectionDescriptor = null;
        renderContext(cfg.title, []);
        document.querySelector("#workspace").innerHTML =
          `<p class="muted">Loading ${esc(cfg.title)}…</p>`;
        try {
          if (name === "providers") {
            const value = await App.request(cfg.action, cfg.data);
            state.rows = Array.isArray(value.providers) ? value.providers : [];
          } else {
            const collection = await App.requestCollection(cfg.action, cfg.data);
            state.rows = collection.items;
            state.collectionDescriptor = collection.descriptor;
          }
          renderContext(cfg.title, state.rows);
          document.querySelector("#workspace").innerHTML = state.rows.length
            ? '<p class="muted">Select an item from the context pane.</p>'
            : '<p class="muted">No items in this queue.</p>';
        } catch (e) {
          if (e.name !== "AbortError")
            document.querySelector("#workspace").textContent = e.message;
        }
      }
      async function startBulkWorkflow() {
        if (state.bulk.job?.status === "running") return;
        const workflow = state.workflow;
        const cfg = workflows[workflow];
        const scope = state.collectionDescriptor && { ...state.collectionDescriptor };
        if (!scope) return;
        state.bulk.job = {
          workflow,
          title: cfg.title,
          scope,
          total: scope.count,
          processed: null,
          counts: {},
          status: scope.count ? "running" : "complete",
          message: scope.count ? "Working…" : "Nothing to process",
        };
        state.bulk.drawerOpen = true;
        setWriterControls();
        renderBulkPresentations();
        if (!scope.count) return;
        try {
          const result = await App.request("bulk.workflow", { workflow, scope }, false, true);
          Object.assign(state.bulk.job, {
            status: result?.ok === false ? "attention" : result?.preparation ? "prepared" : "complete",
            processed: Number.isInteger(result?.processed) ? result.processed : null,
            counts: result?.counts || {},
            message: result?.message || "Finished",
          });
        } catch (error) {
          Object.assign(state.bulk.job, { status: "failed", message: error.message });
        }
        setWriterControls();
        renderBulkPresentations();
      }
      function writerActive() {
        return state.bulk.job?.status === "running";
      }
      function setWriterControls() {
        const active = writerActive();
        document.querySelectorAll("#scan-all, #refresh-actor, #choose-image, #image-file").forEach((control) => {
          control.disabled = active;
        });
        document.body.classList.toggle("bulk-writing", active);
      }
      function bulkMarkup(full = false) {
        const job = state.bulk.job;
        if (!job) return '<div class="bulk-empty"><h1>Bulk</h1><p class="muted">No bulk work has been started.</p></div>';
        const progress = job.status === "running" ? "In progress" : job.processed === null ? "Finished" : `${job.processed} processed`;
        const counts = Object.entries(job.counts || {}).map(([name, value]) => `<li>${esc(name.replaceAll("_", " "))}: ${esc(value)}</li>`).join("");
        return `<div class="bulk-content"><div class="bulk-title"><h1>Bulk</h1>${full ? "" : '<button id="close-bulk" type="button" aria-label="Close Bulk drawer">×</button>'}</div><h2>${esc(job.title)}</h2><p><strong>${esc(job.status)}</strong> · ${esc(progress)}</p>${job.status === "running" ? '<progress aria-label="Bulk work in progress"></progress>' : ""}<p class="muted">${esc(job.message)}</p>${counts ? `<ul>${counts}</ul>` : ""}</div>`;
      }
      function renderBulkPresentations() {
        const job = state.bulk.job;
        const strip = document.querySelector("#job-strip");
        strip.textContent = !job ? "Bulk: idle" : `Bulk: ${job.title} · ${job.status}${job.processed === null ? "" : ` · ${job.processed} processed`}`;
        strip.setAttribute("aria-expanded", state.bulk.drawerOpen);
        const drawer = document.querySelector("#bulk-drawer");
        drawer.hidden = !state.bulk.drawerOpen;
        drawer.innerHTML = state.bulk.drawerOpen ? bulkMarkup(false) : "";
        const close = document.querySelector("#close-bulk");
        if (close) close.onclick = (event) => { event.stopPropagation(); state.bulk.drawerOpen = false; renderBulkPresentations(); };
        if (state.workflow === "bulk") document.querySelector("#workspace").innerHTML = bulkMarkup(true);
      }
      function showBulkWorkspace() {
        state.generation++;
        state.selectionGeneration++;
        state.workflow = "bulk";
        document.querySelector("#context-pane").innerHTML = '<div class="context-nav"><button id="back-overview">⮪ Overview</button></div><h1>Bulk</h1><p class="muted">Application background work</p>';
        document.querySelector("#back-overview").onclick = () => loadOverview();
        renderBulkPresentations();
      }
      function detailPairs(detail) {
        return Object.entries(detail)
          .filter(([k, v]) => !Array.isArray(v) && typeof v !== "object")
          .map(
            ([k, v]) =>
              `<dt>${esc(k.replaceAll("_", " "))}</dt><dd>${esc(v)}</dd>`,
          )
          .join("");
      }
      function artifactLine(name, artifact) {
        return `<dt>${esc(name)}</dt><dd>${artifact?.present ? `Present${artifact.path ? ` · ${esc(artifact.path)}` : ""}` : "Missing"}</dd>`;
      }
      function renderInspector(detail, raw = null) {
        const fields = detail.nfo?.fields || detail.nfos?.find((item) => item.present)?.fields || {};
        const identityNote = detail.ownership?.status === "ambiguous"
          ? `<p class="error"><strong>Ambiguous poster ownership.</strong> ${esc(detail.ownership.reason)}</p>` : "";
        document.querySelector("#workspace").innerHTML =
          `<article class="inspector"><h1>${esc(rowLabel(detail))}</h1>${identityNote}<dl><dt>Directory</dt><dd>${esc(detail.directory)}</dd>${artifactLine("NFO", detail.nfo)}${artifactLine("Poster", detail.poster)}<dt>Video files</dt><dd>${esc(detail.video_count)}</dd>${Object.entries(fields).map(([key, value]) => `<dt>${esc(key.replaceAll("_", " "))}</dt><dd>${esc(typeof value === "object" ? JSON.stringify(value) : value)}</dd>`).join("")}</dl>${raw ? `<details><summary>Raw state</summary><pre>${esc(JSON.stringify(raw, null, 2))}</pre></details>` : ""}</article>`;
      }
      function renderRecordInspector(detail) {
        const known = contexts(detail);
        document.querySelector("#workspace").innerHTML =
          `<article class="inspector"><h1>${esc(rowLabel(detail))}</h1><dl>${detailPairs(detail)}</dl><h2>Known from</h2>${known.length ? `<ul>${known.map((item) => `<li>${esc(item)}</li>`).join("")}</ul>` : '<p class="muted">No saved contexts.</p>'}<details><summary>Raw state</summary><pre>${esc(JSON.stringify(detail, null, 2))}</pre></details></article>`;
      }
      async function rawRecords(kind, identifiers) {
        const values = [];
        for (const identifier of identifiers) {
          values.push(await App.request(`get.${kind}`, { identifier }, true));
        }
        return values.length === 1 ? values[0] : values;
      }
      function renderProvider(profile) {
        const capabilities = Array.isArray(profile.capabilities)
          ? profile.capabilities
          : [];
        const requirements = Array.isArray(profile.credential_requirements)
          ? profile.credential_requirements
          : [];
        document.querySelector("#workspace").innerHTML = `
          <article class="inspector provider-profile">
            <h1>${esc(rowLabel(profile))}</h1>
            <dl>${detailPairs(profile)}</dl>
            <h2>Capabilities</h2>
            ${capabilities.length ? `<ul>${capabilities.map((item) => `<li>${esc(item)}</li>`).join("")}</ul>` : '<p class="muted">None advertised.</p>'}
            <h2>Requirements</h2>
            ${requirements.length ? `<ul>${requirements.map((item) => `<li>${esc(item)}</li>`).join("")}</ul>` : '<p class="muted">None.</p>'}
          </article>`;
      }
      function contexts(detail) {
        let value = detail.contexts || detail.known_from || [];
        return value.map((x) =>
          typeof x === "string"
            ? x
            : x.title || x.movie_title || x.local_target || JSON.stringify(x),
        );
      }
      function renderActorRepair(detail) {
        let known = contexts(detail);
        document.querySelector("#workspace").innerHTML =
          `<article class="actor-repair"><h1>${esc(detail.name)}</h1><p class="missing-note">No local actor image.</p><div id="drop-zone" tabindex="0">Drop an image here<br><span>or</span><br><button id="choose-image">Choose Image…</button><input id="image-file" type="file" accept="image/jpeg,image/png,image/webp" hidden></div><button id="refresh-actor">Refresh from API</button><h2>Known from</h2>${known.length ? `<ul>${known.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : '<p class="muted">No saved contexts.</p>'}<dl>${detailPairs(detail)}</dl><details><summary>Raw state</summary><pre>${esc(JSON.stringify(detail, null, 2))}</pre></details></article>`;
        const input = document.querySelector("#image-file"),
          zone = document.querySelector("#drop-zone");
        document.querySelector("#choose-image").onclick = (e) => {
          e.stopPropagation();
          input.click();
        };
        input.onchange = () =>
          input.files[0] && installFile(detail.name, input.files[0]);
        zone.ondragover = (e) => {
          e.preventDefault();
          zone.classList.add("drag");
        };
        zone.ondragleave = () => zone.classList.remove("drag");
        zone.ondrop = (e) => {
          e.preventDefault();
          zone.classList.remove("drag");
          e.dataTransfer.files[0] &&
            installFile(detail.name, e.dataTransfer.files[0]);
        };
        document.querySelector("#refresh-actor").onclick = () =>
          repairActor("refresh.actor.image", { identifier: detail.name });
        setWriterControls();
      }
      async function installFile(name, file) {
        if (writerActive()) {
          showError("Bulk work is currently writing; wait for it to finish.");
          return;
        }
        if (file.size > 8000000) {
          showError("Image is larger than 8 MB");
          return;
        }
        try {
          const dataUrl = await normalizeActorImage(file);
          await repairActor("actor.install_image", {
            identifier: name,
            data_url: dataUrl,
          });
        } catch (error) {
          showError(error.message || "Could not prepare image");
        }
      }
      function normalizeActorImage(file) {
        return new Promise((resolve, reject) => {
          const sourceUrl = URL.createObjectURL(file);
          const image = new Image();
          image.onload = () => {
            URL.revokeObjectURL(sourceUrl);
            const scale = Math.min(1, 185 / image.width, 278 / image.height);
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(image.width * scale));
            canvas.height = Math.max(1, Math.round(image.height * scale));
            canvas
              .getContext("2d")
              .drawImage(image, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(
              (blob) => {
                if (!blob) {
                  reject(Error("Browser could not encode the image as JPEG"));
                  return;
                }
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () =>
                  reject(Error("Could not read normalized JPEG"));
                reader.readAsDataURL(blob);
              },
              "image/jpeg",
              0.75,
            );
          };
          image.onerror = () => {
            URL.revokeObjectURL(sourceUrl);
            reject(Error("The selected file is not a readable image"));
          };
          image.src = sourceUrl;
        });
      }
      async function repairActor(action, data) {
        if (writerActive()) {
          showError("Bulk work is currently writing; wait for it to finish.");
          return;
        }
        const selected = document.querySelector("[data-row].selected");
        const selectedIndex = selected ? Number(selected.dataset.row) : 0;
        document.querySelector("#workspace").classList.add("busy");
        try {
          await App.request(action, data, true);
          await refreshInventory();
          await openWorkflow("missing-actor-images");
          if (state.rows.length) {
            selectRow(Math.min(selectedIndex, state.rows.length - 1));
          }
        } catch (e) {
          if (e.name !== "AbortError") showError(e.message);
        } finally {
          document.querySelector("#workspace").classList.remove("busy");
        }
      }
      function showError(message) {
        document
          .querySelector("#workspace")
          .insertAdjacentHTML(
            "afterbegin",
            `<p class="error">${esc(message)}</p>`,
          );
      }
      async function selectRow(index) {
        let row = state.rows[index],
          cfg = workflows[state.workflow];
        if (!row) return;
        state.selectionGeneration++;
        document
          .querySelectorAll("[data-row]")
          .forEach((b, i) => b.classList.toggle("selected", i === index));
        document.querySelector("#workspace").innerHTML =
          '<p class="muted">Loading…</p>';
        if (state.workflow === "providers") {
          renderProvider(row);
          return;
        }
        if (!cfg?.get) return;
        try {
          let detail = await App.request(
            cfg.inspect || cfg.get,
            { identifier: rowIdentifier(row) },
            true,
          );
          if (!cfg.inspect) {
            cfg.repair ? renderActorRepair(detail) : renderRecordInspector(detail);
            return;
          }
          const rawIds = row.grouped
            ? detail.manifest_identities
            : [row.identifier || detail.selected_manifest_identity];
          renderInspector(detail, await rawRecords(detail.kind, rawIds));
        } catch (e) {
          if (e.name !== "AbortError") showError(e.message);
        }
      }
      async function search(query) {
        state.generation++;
        state.selectionGeneration++;
        state.workflow = "search";
        try {
          const collection = await App.requestCollection("search", { query });
          state.rows = collection.items;
          renderContext("Search results", state.rows);
          document.querySelector("#workspace").innerHTML = state.rows.length
            ? '<p class="muted">Select a search result.</p>'
            : '<p class="muted">No local matches.</p>';
          document
            .querySelectorAll("[data-row]")
            .forEach((b) => (b.onclick = () => selectSearch(+b.dataset.row)));
        } catch (e) {
          if (e.name !== "AbortError") showError(e.message);
        }
      }
      async function selectSearch(i) {
        let row = state.rows[i];
        state.selectionGeneration++;
        try {
          const inspectable = row.kind === "movie" || row.kind === "show";
          let detail = await App.request(
            `${inspectable ? "inspect" : "get"}.${row.kind}`,
            { identifier: row.identifier },
            true,
          );
          if (!inspectable) {
            renderRecordInspector(detail);
            return;
          }
          renderInspector(detail, await rawRecords(row.kind, [row.identifier]));
        } catch (e) {
          if (e.name !== "AbortError") showError(e.message);
        }
      }
      async function refreshInventory() {
        try {
          state.inventory = await App.request("inventory");
        } catch (e) {
          if (e.name !== "AbortError") showError(e.message);
        }
      }
      async function loadOverview() {
        state.generation++;
        await refreshInventory();
        renderOverview();
      }
      async function start() {
        const generation = ++state.generation;
        setStartupScanning(true);
        try {
          await App.request("rescan");
        } catch (error) {
          if (error.name !== "AbortError") {
            console.warn("Local census rescan skipped:", error.message);
            showStartupRescanFailure(error);
          }
          return;
        }
        setStartupScanning(false);
        if (generation !== state.generation) return;
        await loadOverview();
      }
      function showStartupRescanFailure(error) {
        document.querySelector("#context-pane").innerHTML =
          "<h1>Local library unavailable</h1>";
        document.querySelector("#workspace").innerHTML = `
          <article class="inspector">
            <h1>Census not refreshed</h1>
            <p>Harvester could not verify the local Movie and TV libraries.</p>
            <p class="error">${esc(error.message || "Local rescan failed")}</p>
            <p class="muted">Work queues and Search remain unavailable until Harvester can complete a local rescan.</p>
          </article>`;
      }
      function setStartupScanning(scanning) {
        document.querySelector("#work-menu").disabled = scanning;
        document.querySelectorAll("[data-work]").forEach((button) => {
          button.disabled = scanning;
        });
        document.querySelector("#search").disabled = scanning;
        if (scanning) {
          closeMenus();
          document.querySelector("#context-pane").innerHTML =
            "<h1>Scanning local libraries…</h1>";
          document.querySelector("#workspace").innerHTML =
            '<p class="muted">Rebuilding the local census before loading queues.</p>';
        }
      }
      function bindWork() {
        document.querySelectorAll("[data-work]").forEach(
          (b) =>
            (b.onclick = () => {
              closeMenus();
              openWorkflow(b.dataset.work);
            }),
        );
      }
      bindWork();
      document.querySelector("#job-strip").onclick = () => {
        state.bulk.drawerOpen = !state.bulk.drawerOpen;
        renderBulkPresentations();
      };
      document.querySelector("#search").oninput = (e) => {
        clearTimeout(state.searchTimer);
        let q = e.target.value.trim();
        state.searchTimer = setTimeout(
          () => (q ? search(q) : loadOverview()),
          220,
        );
      };
      function closeMenus() {
        document.querySelectorAll(".menu.open").forEach((m) => {
          m.classList.remove("open");
          m.querySelector(".menu-label").setAttribute("aria-expanded", "false");
        });
      }
      document.querySelectorAll(".menu-label").forEach(
        (b) =>
          (b.onclick = () => {
            let m = b.parentElement,
              o = !m.classList.contains("open");
            closeMenus();
            m.classList.toggle("open", o);
            b.setAttribute("aria-expanded", o);
          }),
      );
      document.onclick = (e) => {
        if (!e.target.closest(".menu")) closeMenus();
      };
      document.onkeydown = (e) => {
        if (e.key === "Escape") closeMenus();
      };
      const splitter = document.querySelector("#splitter"),
        pane = document.querySelector("#context-pane");
      function setWidth(w) {
        state.leftWidth = Math.max(130, Math.min(w, innerWidth - 260));
        pane.style.width = state.leftWidth + "px";
      }
      splitter.onpointerdown = (e) => {
        splitter.setPointerCapture(e.pointerId);
        let start = e.clientX,
          width = state.leftWidth;
        splitter.onpointermove = (m) => setWidth(width + m.clientX - start);
        splitter.onpointerup = () => (splitter.onpointermove = null);
      };
      splitter.ondblclick = () => setWidth(184);
      splitter.onkeydown = (e) => {
        if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
          e.preventDefault();
          setWidth(state.leftWidth + (e.key === "ArrowRight" ? 10 : -10));
        }
      };
      document.querySelector("#reset-pane").onclick = () => {
        setWidth(184);
        closeMenus();
      };
      document.querySelector("#toggle-context").onclick = (e) => {
        state.contextVisible = !state.contextVisible;
        pane.hidden = !state.contextVisible;
        splitter.hidden = !state.contextVisible;
        e.target.textContent = state.contextVisible
          ? "Hide Context Pane"
          : "Show Context Pane";
        closeMenus();
      };
      setWidth(184);
      start();
    </script>
  </body>
</html>
